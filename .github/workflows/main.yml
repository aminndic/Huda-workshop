name: Build Huda Workshop Offline APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install buildozer "cython==0.29.37"
          pip install python-for-android==2024.1.21

      - name: Check environment
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
          java -version
          buildozer --version
          p4a --version

      - name: Build APK
        run: |
          yes | buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: huda-workshop-offline-apk
          path: bin/*.apk
